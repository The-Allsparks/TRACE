name: CI

# Third-party actions are pinned to full commit SHAs (issue #22). Version
# comments keep Dependabot able to propose pin updates.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Grant Gradle permissions
        if: runner.os != 'Windows'
        run: chmod +x gradlew
      - name: Compile and test
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./gradlew check --no-daemon

  docs-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Required documentation present
        run: |
          set -e
          test -f README.md
          test -f LICENSE
          test -f CONTRIBUTING.md
          test -f SECURITY.md
          test -f CODE_OF_CONDUCT.md
          test -f docs/architecture.md
          test -f docs/data-model.md
          test -f docs/schema.md
          test -f docs/performance.md
          test -f docs/storage.md
          test -f docs/replay.md
          test -f docs/integrations.md
          test -f docs/student-learning-path.md
          test -f docs/mentor-guide.md
          test -f docs/troubleshooting.md
          test -f docs/research/ecosystem-review.md
          test -f docs/research/source-register.md
          test -f docs/research/build-vs-adopt.md
          test -f docs/adr/0001-build-versus-adopt.md
          test -f docs/audits/initial-deep-audit.md
          test -f docs/audits/priority-ledger.md
