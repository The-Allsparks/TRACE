plugins {
    id 'java-library'
}

group = 'org.allsparks'
version = '0.1.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
    withSourcesJar()
    withJavadocJar()
}

repositories {
    mavenCentral()
    maven {
        name = 'GitHubPackagesAllsparksContracts'
        url = uri('https://maven.pkg.github.com/The-Allsparks/allsparks-contracts')
        credentials {
            username = findProperty('gpr.user') ?: System.getenv('GPR_USERNAME') ?: System.getenv('GITHUB_ACTOR') ?: ''
            password = findProperty('gpr.token') ?: System.getenv('GPR_TOKEN') ?: System.getenv('GITHUB_TOKEN') ?: ''
        }
    }
}

sourceSets {
    examples {
        java {
            srcDirs = ['examples/src']
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    test {
        compileClasspath += sourceSets.examples.output
        runtimeClasspath += sourceSets.examples.output
    }
}

configurations {
    examplesImplementation.extendsFrom api
    examplesImplementation.extendsFrom implementation
    examplesRuntimeOnly.extendsFrom runtimeOnly
}

dependencies {
    // Public because TraceClock extends MonotonicClock and TraceMappings
    // returns Validity / HealthSeverity. Does not pull HELM, AMPER, or MIMIC.
    api 'org.allsparks:allsparks-contracts:0.1.0-rc.1'
    testImplementation platform('org.junit:junit-bom:5.14.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        events 'failed'
        exceptionFormat 'full'
    }
}

tasks.named('jar', Jar) {
    manifest {
        attributes(
                'Implementation-Title': 'TRACE',
                'Implementation-Version': archiveVersion,
                'Automatic-Module-Name': 'org.allsparks.trace',
                'Main-Class': 'org.allsparks.trace.tools.TraceInspect'
        )
    }
}

tasks.named('compileTestJava') {
    dependsOn 'compileExamplesJava'
}

tasks.named('check') {
    dependsOn 'compileExamplesJava'
    dependsOn 'javadoc'
    dependsOn ':trace-advantagescope:check'
}

tasks.named('javadoc', Javadoc) {
    options.encoding = 'UTF-8'
    options.addStringOption('Xdoclint:none', '-quiet')
    failOnError = true
}
